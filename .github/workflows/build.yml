name: Đóng gói ứng dụng

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: dong-goi-${{ github.ref }}
  cancel-in-progress: true

jobs:

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Giải nén mã nguồn và biểu tượng
        run: node prepare.js

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Tạo biểu tượng và màn hình khởi động
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2350d8' --iconBackgroundColorDark '#2350d8'

      - name: Ghi số phiên bản
        run: node prepare.js android-version

      - name: Đồng bộ mã nguồn web
        run: npx cap sync android

      - name: Biên dịch APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đặt tên tệp APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/thitructuyen-1.0.0-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Phát hành (mục Releases)
    needs: [android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Tạo bản phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(out/**/*.apk out/**/*.exe out/**/*.ipa)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Không có tệp nào được tạo - xem lỗi ở các bước phía trên."
            exit 1
          fi
          TAG="build-${{ github.run_number }}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Bản dựng #${{ github.run_number }} (v1.0.0)" \
            --notes "Tự động đóng gói bằng GitHub Actions."
