/* CSS hiển thị công thức Toán - Lý - Hóa - Sinh trực tiếp trên trình duyệt (HTML5/CSS/SVG & KaTeX) */
.math-render{display:inline-block;vertical-align:middle;line-height:1.25;margin:0 1px}
.math-render.math-block{display:block;text-align:center;margin:8px 0;overflow-x:auto}
.math-render .katex{font-size:1.06em;line-height:1.2}
.bmath{display:inline-flex;align-items:center;vertical-align:middle;font-family:"Cambria Math","Times New Roman","STIX Two Math",serif;font-size:1.05em;line-height:1.2;gap:1px;white-space:nowrap}
.bmath.bmath-block{display:flex;justify-content:center;margin:8px 0;overflow-x:auto}
.bmath i.bm-var{font-style:italic;padding:0 .5px}
.bmath .bm-rom{font-style:normal}
.bmath .bm-op{padding:0 3px;font-style:normal}
.bmath .bm-fn{font-style:normal;padding-right:2px}
.bmath .bm-bb{font-weight:700;font-family:"Cambria Math","Times New Roman",serif}
.bmath .bm-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.9em;line-height:1.1}
.bmath .bm-frac>.bm-num{padding:0 3px 1px;border-bottom:1.2px solid currentColor;text-align:center;width:100%}
.bmath .bm-frac>.bm-den{padding:1px 3px 0;text-align:center;width:100%}
.bmath .bm-frac.bm-nobar>.bm-num{border-bottom:0}
.bmath .bm-sqrt{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 1px}
.bmath .bm-sqrt-deg{font-size:.65em;line-height:1;align-self:flex-start;margin-right:-2px;margin-top:1px}
.bmath .bm-sqrt-sign{display:inline-flex;align-items:stretch;font-size:1.15em;line-height:1;padding-right:1px;user-select:none}
.bmath .bm-sqrt-body{border-top:1.25px solid currentColor;padding:1px 3px 0 1px;display:inline-flex;align-items:center}
.bmath .bm-subsup{display:inline-flex;flex-direction:column;justify-content:center;align-items:flex-start;vertical-align:middle;font-size:.74em;line-height:1.05;margin-left:.5px}
.bmath .bm-subsup.bm-pre{align-items:flex-end;margin-left:0;margin-right:1px}
.bmath .bm-subsup>.bm-sup{margin-bottom:1px}
.bmath .bm-subsup>.bm-sub{margin-top:1px}
.bmath sup.bm-sup-only{font-size:.74em;line-height:1;vertical-align:super;margin-left:.5px}
.bmath sub.bm-sub-only{font-size:.74em;line-height:1;vertical-align:sub;margin-left:.5px}
.bmath .bm-xarrow{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1}
.bmath .bm-xarrow>.bm-xa-top{font-size:.72em;padding:0 4px;min-height:.9em;white-space:nowrap}
.bmath .bm-xarrow>.bm-xa-mid{display:flex;align-items:center;width:100%;min-width:28px;font-size:1.05em;line-height:.8;justify-content:center;position:relative}
.bmath .bm-xarrow>.bm-xa-mid.bm-line-r::before{content:"";flex:1;height:1.3px;background:currentColor;margin-right:-2px}
.bmath .bm-xarrow>.bm-xa-mid.bm-line-r::after{content:"▸";font-size:.9em;line-height:1}
.bmath .bm-xarrow>.bm-xa-mid.bm-line-l::before{content:"◂";font-size:.9em;line-height:1}
.bmath .bm-xarrow>.bm-xa-mid.bm-line-l::after{content:"";flex:1;height:1.3px;background:currentColor;margin-left:-2px}
.bmath .bm-xarrow>.bm-xa-bot{font-size:.72em;padding:0 4px;white-space:nowrap}
.bmath .bm-over{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05}
